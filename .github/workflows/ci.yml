name: CI
on: [push, pull_request]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          errors=0
          while IFS= read -r f; do
            echo "Checking $f..."
            bash -n "$f" || { echo "✗ Syntax error in $f"; errors=$((errors + 1)); }
          done < <(find . -name '*.sh' -not -path './.git/*')
          if [ "$errors" -eq 0 ]; then
            echo "✓ All scripts pass syntax check"
          else
            echo "✗ $errors script(s) have syntax errors"
            exit 1
          fi

      - name: Updater release-selection test
        run: bash tests/test-updater-selects-latest-v2.sh

      - name: Updater exact-version test
        run: bash tests/test-updater-version-override.sh

      - name: Version menu test
        run: bash tests/test-install-version-menu.sh

      - name: Version menu GitHub cap test
        run: bash tests/test-install-menu-github-cap.sh

      - name: Version menu rate-limit/cache test
        run: bash tests/test-install-menu-ratelimit.sh

      - name: Bun updater latest-release test
        run: bash tests/test-bun-updater-latest.sh

      - name: Bun updater exact-version test
        run: bash tests/test-bun-updater-version-override.sh

      - name: Bun updater checksum-mismatch test
        run: bash tests/test-bun-updater-checksum-mismatch.sh

      - name: Bun version menu test
        run: bash tests/test-bun-version-menu.sh

      - name: Bun version menu GitHub cap test
        run: bash tests/test-bun-install-menu-github-cap.sh

      - name: Bun version menu rate-limit/cache test
        run: bash tests/test-bun-install-menu-ratelimit.sh

      - name: ShellCheck lint
        run: |
          errors=0
          while IFS= read -r f; do
            echo "=== ShellCheck: $f ==="
            shellcheck --severity=warning "$f" || { echo "✗ ShellCheck found issues in $f"; errors=$((errors + 1)); }
          done < <(find . -name '*.sh' -not -path './.git/*')
          if [ "$errors" -eq 0 ]; then
            echo "✓ All scripts pass ShellCheck"
          else
            echo "✗ $errors script(s) failed ShellCheck"
            exit 1
          fi
